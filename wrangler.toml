# Cloudflare Pages - Shorten Link Transmigrasi
name = "shotlink-kementras"
compatibility_date = "2026-09-26"
pages_build_output_dir = "public"

# KV Namespace binding untuk menyimpan data (user, link, session)
[[kv_namespaces]]
binding = "LINKS"
id = "3fe80920bc094c1dbb31424170300420"

# Variable env - bisa juga diatur lewat Cloudflare Dashboard:
# Workers & Pages > shotlink-kementras > Settings > Variables and Secrets
#
# [vars]
# ADMIN_USERNAMES = "admin"
# ALLOW_REGISTRATION = "false"

