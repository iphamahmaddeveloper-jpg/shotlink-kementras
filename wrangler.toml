# Nama project Cloudflare Pages. Ganti kalau deploy ke akun/project baru.
name = "shotlink-kementras"
compatibility_date = "2026-09-26"

# Ganti id dengan KV namespace di akun Cloudflare yang dipakai.
# Bikin lewat dashboard (Workers & Pages > KV) atau: npx wrangler kv namespace create LINKS
[assets]
directory = "./public"

# Variable ADMIN_USERNAMES dan ALLOW_REGISTRATION diisi lewat dashboard:
# Pages > Settings > Variables and Secrets. Lihat README.
